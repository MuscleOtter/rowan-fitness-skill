name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run packaging tests
        run: python3 -m unittest tools/test_package.py -v
      - name: Verify distribution bytes
        run: python3 tools/package.py --check
